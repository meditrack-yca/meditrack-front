name: CI Angular

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Étape de Lint
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # Version principale
          cache: 'npm'

      - name: Installation propre des dépendances
        run: npm ci

      - name: Vérification du Lint
        run: npm run lint

  # 2. Étape de Tests
  test:
    name: Tests (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Installation propre des dépendances
        run: npm ci

      - name: Exécution des tests (Chrome Headless)
        run: npm run test:ci

  # 3. Étape de Build création de l'artefact
  build:
    name: Build & Upload
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Installation propre des dépendances
        run: npm ci

      - name: Compilation production
        run: npm run build

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist-front
          path: dist/